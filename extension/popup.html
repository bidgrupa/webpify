<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>webpify</title>
    <link rel="stylesheet" href="styles/page.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup">
    <header class="masthead">
      <div class="wrap masthead-inner">
        <svg class="mark" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.25 4.75H5.25a2.5 2.5 0 0 0-2.5 2.5v7.5a2.5 2.5 0 0 0 2.5 2.5h7.5a2.5 2.5 0 0 0 2.5-2.5V2.25" />
          <path d="M12.5 5l2.75-2.75L18 5" />
          <path d="M5.5 14.25l3.25-3.5 3.25 3.5" />
          <circle cx="11.75" cy="8.25" r="1.25" fill="currentColor" stroke="none" />
        </svg>
        <div>
          <h1>webpify</h1>
          <p id="page-host">This page</p>
        </div>
      </div>
    </header>

    <main class="wrap">
      <section class="group" aria-label="This site">
        <div class="group-body">
          <label class="switch" id="site-row">
            <input id="site-switch" type="checkbox" role="switch" />
            <span class="switch-label">Convert uploads on this site</span>
            <span class="switch-help" id="site-help"></span>
          </label>
          <button class="btn btn--small" id="grant" type="button" hidden>Allow access</button>
          <p class="callout" id="unsupported" hidden>
            webpify can't run on this page. Open the site where you upload images or videos, then
            click the icon again.
          </p>
          <p class="status" id="site-status" role="status"></p>
        </div>
      </section>

      <section class="group" aria-label="Pause">
        <div class="group-body">
          <button class="btn" id="pause" type="button">Pause for 10 minutes</button>
          <p class="help" id="pause-help"></p>
        </div>
      </section>
    </main>

    <footer class="popup-foot">
      <button class="btn btn--small" id="open-settings" type="button">Open settings</button>
    </footer>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
